name: Build NanoClaw riscv64 image

on:
  workflow_dispatch:
    inputs:
      nanoclaw_version:
        description: 'NanoClaw version tag to build'
        required: true
        default: 'main'
  schedule:
    - cron: '0 4 * * 1'  # Weekly, Monday 04:00 UTC

jobs:
  build:
    runs-on: [self-hosted, riscv64]
    permissions:
      contents: read
      packages: write
    env:
      NANOCLAW_VERSION: ${{ inputs.nanoclaw_version || 'latest' }}

    steps:
      - name: Checkout upstream NanoClaw
        uses: actions/checkout@v4
        with:
          repository: qwibitai/nanoclaw
          ref: ${{ inputs.nanoclaw_version || 'main' }}

      - name: Overlay riscv64 files from fork
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            container/Dockerfile.riscv64
            container/agent-runner/package.json
            container/agent-runner/tsconfig.json
            container/agent-runner/src/db/connection.ts
            container/agent-runner/src/db/messages-out.ts
            container/agent-runner/src/db/messages-in.ts
          sparse-checkout-cone-mode: false
          path: _fork

      - name: Copy riscv64 files
        run: |
          cp _fork/container/Dockerfile.riscv64 container/
          cp _fork/container/agent-runner/package.json container/agent-runner/
          cp _fork/container/agent-runner/tsconfig.json container/agent-runner/
          mkdir -p container/agent-runner/src/db
          cp _fork/container/agent-runner/src/db/connection.ts container/agent-runner/src/db/
          cp _fork/container/agent-runner/src/db/messages-out.ts container/agent-runner/src/db/
          cp _fork/container/agent-runner/src/db/messages-in.ts container/agent-runner/src/db/

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        env:
          GHCR: ghcr.io/${{ github.repository_owner }}/nanoclaw
          DHUB: ${{ secrets.DOCKERHUB_USERNAME }}/nanoclaw
        run: |
          cd container
          time docker build \
            -f Dockerfile.riscv64 \
            -t "${GHCR}:${NANOCLAW_VERSION}-riscv64" \
            -t "${GHCR}:riscv64" \
            -t "${DHUB}:${NANOCLAW_VERSION}-riscv64" \
            -t "${DHUB}:riscv64" \
            .

          docker push --all-tags "${GHCR}"
          docker push --all-tags "${DHUB}"

  smoke-test:
    needs: build
    runs-on: [self-hosted, riscv64]
    env:
      NANOCLAW_VERSION: ${{ inputs.nanoclaw_version || 'latest' }}
    steps:
      - name: Checkout upstream NanoClaw for v2 session schema
        uses: actions/checkout@v4
        with:
          repository: qwibitai/nanoclaw
          ref: ${{ inputs.nanoclaw_version || 'main' }}

      - name: Overlay smoke bootstrap from fork
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/smoke/bootstrap-session-dbs.mjs
            .github/smoke/diag-sqlite-stack.cjs
          sparse-checkout-cone-mode: false
          path: _fork

      - name: Pull image from Docker Hub
        env:
          DHUB: ${{ secrets.DOCKERHUB_USERNAME }}/nanoclaw
        run: |
          docker pull "${DHUB}:${NANOCLAW_VERSION}-riscv64"

      - name: Bootstrap a v2 session workspace
        env:
          DHUB: ${{ secrets.DOCKERHUB_USERNAME }}/nanoclaw
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          echo "WORK=${WORK}" >> "${GITHUB_ENV}"
          # v2 expects a host-prepared /workspace: inbound.db (read-only
          # to the container), outbound.db, and agent/container.json.
          # Build the DBs with the image's own riscv64 better-sqlite3 and
          # the upstream host schema verbatim, so the smoke test stays in
          # lock-step with upstream instead of a hand-copied schema.
          BOOT="_fork/.github/smoke/bootstrap-session-dbs.mjs"
          docker run --rm \
            --entrypoint node \
            --user "$(id -u):$(id -g)" \
            -e HOME=/home/node \
            -v "${WORK}:/work" \
            -v "${PWD}/src/db/schema.ts:/schema.ts:ro" \
            -v "${PWD}/${BOOT}:/bootstrap.mjs:ro" \
            "${DHUB}:${NANOCLAW_VERSION}-riscv64" \
            /bootstrap.mjs /schema.ts /work

      - name: Smoke test - v2 agent-runner enters poll loop
        env:
          DHUB: ${{ secrets.DOCKERHUB_USERNAME }}/nanoclaw
        run: |
          set -uo pipefail
          # v2 has no stdin/stdout contract: it polls inbound.db
          # forever. With an empty inbound.db the loop idles, so a
          # timeout kill after a clean start is the success signal.
          # The entrypoint runs tsc (~45s on riscv64) first, so allow
          # generous headroom.
          status=0
          OUTPUT="$(timeout 150 docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/home/node \
            -e NODE_OPTIONS=--require=/diag.cjs \
            -v "${PWD}/_fork/.github/smoke/diag-sqlite-stack.cjs:/diag.cjs:ro" \
            -v "${WORK}:/workspace" \
            "${DHUB}:${NANOCLAW_VERSION}-riscv64" 2>&1)" || status=$?
          echo "${OUTPUT}"
          if ! echo "${OUTPUT}" | grep -q "Starting v2 agent-runner"; then
            echo "Smoke test FAILED: v2 agent-runner did not start"
            exit 1
          fi
          # The poll loop never exits on its own, so the timeout kill
          # (exit 124) is the success signal. Any other exit code means
          # the runner started and then died early, which is a failure.
          if [ "${status}" -ne 124 ]; then
            echo "Smoke test FAILED: runner exited early (status=${status})"
            exit 1
          fi
          if echo "${OUTPUT}" | grep -q "Fatal error"; then
            echo "Smoke test FAILED: fatal error during startup"
            exit 1
          fi
          # Fail on missing vendored binaries (the ripgrep issue)
          if echo "${OUTPUT}" | grep -q "ENOENT"; then
            echo "Smoke test FAILED: missing binary detected"
            exit 1
          fi
          echo "Smoke test PASSED: v2 runner reached the poll loop"

      - name: Clean up session workspace
        if: always()
        run: |
          rm -rf "${WORK:-}" || true
